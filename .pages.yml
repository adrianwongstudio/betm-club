            label: Tile size
            type: select
            options:
              values: [tall, wide, half, sm]
          - { name: caption, label: Caption, type: string }
          - { name: image, label: Photo, type: image, required: false }
      - name: cells
        label: Full gallery tiles (Gallery page)
        type: object
        list: true
        fields:
          - name: span
            label: Tile size
            type: select
            options:
              values: [tall, wide, half, sm]
          - { name: caption, label: Caption, type: string }
          - { name: image, label: Photo, type: image, required: false }

  # ─────────────────────────────────────────────────────────────────────────
  #   Gala page
  # ─────────────────────────────────────────────────────────────────────────
  - name: gala
    label: "🎉 Gala page"
    type: file
    path: src/_data/gala.json
    format: json
    fields:
      - name: meta
        label: SEO
        type: object
        fields:
          - { name: title, label: Page title, type: string }
          - { name: description, label: Meta description, type: text }
      - name: page_hero
        label: Page top band
        type: object
        fields:
          - { name: eyebrow, label: Eyebrow, type: string }
          - { name: headline, label: Headline, type: string }
          - { name: intro, label: Intro paragraph, type: text, required: false }
      - { name: eyebrow, label: Section eyebrow, type: string }
      - { name: headline, label: Section headline, type: string }
      - { name: lead, label: Lead paragraph, type: text }
      - name: past_events
        label: Past events (also appears in header Gala menu)
        type: object
        list: true
        fields:
          - { name: year, label: Year, type: number }
          - { name: label, label: Label, type: string }
          - { name: href, label: Link, type: string }
      - { name: note, label: Bottom note, type: text }
      - { name: registration_open, label: Registration open?, type: boolean }
      - name: registration_cta
        label: Registration button (shown when open)
        type: object
        fields:
          - { name: label, label: Label, type: string }
          - { name: href, label: Link, type: string }
      - name: recap
        label: Gala recap (alternating photo + text rows)
        type: object
        fields:
          - { name: heading, label: Section heading (e.g. "2025 Gala — in pictures"), type: string, required: false }
          - name: rows
            label: Recap rows
            type: object
            list: true
            fields:
              - { name: eyebrow, label: Eyebrow label (optional), type: string, required: false }
              - { name: heading, label: Row heading, type: string }
              - { name: text, label: Body text, type: text, required: false }
              - name: images
                label: Photo(s) — add 2 to show side-by-side
                type: object
                list: true
                fields:
                  - { name: src, label: Photo, type: image }
                  - { name: alt, label: Alt text (describe the photo), type: string, required: false }
      - name: video
        label: Video highlight (shown after the recap)
        type: object
        fields:
          - { name: eyebrow, label: Eyebrow label, type: string, required: false }
          - { name: heading, label: Heading, type: string }
          - { name: text, label: Body text (shown on the left), type: text, required: false }
          - name: url
            label: Video URL (YouTube share/watch link or MP4)
            type: string
            required: false
            description: |
              Paste any YouTube URL (watch, youtu.be, /embed/, /shorts/) — it's
              normalized to the correct embed automatically. Or paste a direct
              .mp4/.webm/.mov URL and it renders in an HTML5 video player.
              Leave blank to hide this section.
          - { name: poster, label: Poster image (only used for MP4 files), type: image, required: false }
      - name: supporters
        label: Sponsors & auction contributors (bottom of Gala page)
        type: object
        fields:
          - { name: heading, label: Section heading (e.g. "Thank you"), type: string, required: false }
          - { name: intro, label: Intro paragraph, type: text, required: false }
          - name: sponsors
            label: Sponsors group
            type: object
            fields:
              - { name: eyebrow, label: Eyebrow label, type: string, required: false }
              - { name: title, label: Group heading, type: string, required: false }
              - name: items
                label: Sponsors
                type: object
                list: true
                fields:
                  - { name: name, label: Company name, type: string }
                  - { name: image, label: Logo, type: image, required: false }
                  - { name: description, label: Description (shown in the pop-out panel), type: text, required: false }
                  - { name: products_services, label: Products & services, type: text, required: false }
                  - { name: url, label: Website URL (optional), type: string, required: false }
          - name: auction
            label: Auction contributors group
            type: object
            fields:
              - { name: eyebrow, label: Eyebrow label, type: string, required: false }
              - { name: title, label: Group heading, type: string, required: false }
              - name: items
                label: Auction contributors
                type: object
                list: true
                fields:
                  - { name: name, label: Company name, type: string }
                  - { name: image, label: Logo, type: image, required: false }
                  - { name: description, label: Description (shown in the pop-out panel), type: text, required: false }
                  - { name: products_services, label: Products & services, type: text, required: false }
                  - { name: url, label: Website URL (optional), type: string, required: false }
      - name: extras
        label: Extra content blocks (Gala page only)
        type: object
        list: true
        fields:
          - { name: heading, label: Heading, type: string }
          - { name: body, label: Body, type: text }

  # ─────────────────────────────────────────────────────────────────────────
  #   Attend page
  # ─────────────────────────────────────────────────────────────────────────
  - name: attend
    label: "✅ Attend page"
    type: file
    path: src/_data/attend.json
    format: json
    fields:
      - name: meta
        label: SEO
        type: object
        fields:
          - { name: title, label: Page title, type: string }
          - { name: description, label: Meta description, type: text }
      - name: page_hero
        label: Page top band
        type: object
        fields:
          - { name: eyebrow, label: Eyebrow, type: string }
          - { name: headline, label: Headline, type: string }
          - { name: intro, label: Intro paragraph, type: text, required: false }
      - { name: eyebrow, label: Section eyebrow, type: string }
      - { name: headline, label: Section headline, type: string }
      - { name: lead, label: Lead paragraph, type: text }
      - { name: map_caption, label: Map placeholder caption, type: string }
      - { name: map_image, label: Static map image (fallback), type: image, required: false }
      - { name: finding_the_room, label: '"Finding the room" paragraph', type: text }
      - { name: form_endpoint, label: Guest form endpoint (leave blank to use mailto), type: string, required: false }
      - name: expect
        label: "What to expect on your first visit"
        type: object
        fields:
          - { name: heading, label: Section heading, type: string }
          - name: items
            label: Steps
            type: object
            list: true
            fields:
              - { name: step, label: Step title, type: string }
              - { name: body, label: Description, type: text }

  # ─────────────────────────────────────────────────────────────────────────
  #   Blog posts
  # ─────────────────────────────────────────────────────────────────────────
  - name: posts
    label: "✍︎ Blog posts"
    type: collection
    path: src/posts
    format: yaml-frontmatter
    view:
      fields: [title, date, category]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    filename: "{year}-{month}-{day}-{fields.title}.md"
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: date, label: Publish date, type: date, required: true, default: "@now" }
      - name: category
        label: Category
        type: select
        options:
          values: [Speaking, Member stories, Leadership, Club news, Events]
        default: Speaking
      - { name: excerpt, label: Excerpt (shown on card), type: text, required: true }
      - { name: image, label: Featured image, type: image, required: false }
      - { name: body, label: Body, type: rich-text }
