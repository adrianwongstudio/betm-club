          - { name: href, label: Link, type: string }
      - name: cards
        label: Cards (3 recommended)
        type: object
        list: true
        fields:
          - { name: eyebrow, label: Eyebrow, type: string }
          - { name: title, label: Title, type: string }
          - { name: body, label: Body copy, type: text }
          - { name: image, label: Photo (3:2 landscape), type: image, required: false }
          - { name: placeholder, label: Placeholder caption, type: string, required: false }
          - name: cta
            label: Text link
            type: object
            fields:
              - { name: label, label: Label, type: string }
              - { name: href, label: Link, type: string }
      - name: role_details
        label: Meeting roles in full (Members page only)
        type: object
        fields:
          - { name: eyebrow, label: Eyebrow, type: string }
          - { name: heading, label: Section heading, type: string }
          - { name: intro, label: Intro paragraph, type: text, required: false }
          - name: roles
            label: Roles
            type: object
            list: true
            fields:
              - { name: name, label: Role name, type: string }
              - { name: summary, label: One-line summary, type: text }
              - name: do
                label: "What you'll do"
                type: string
                list: true
              - name: skills
                label: Real-world skills
                type: string
                list: true
              - { name: pro_tip, label: Pro tip (optional), type: text, required: false }
      - name: checklists
        label: Prep checklists (Members page only)
        type: object
        fields:
          - { name: eyebrow, label: Eyebrow, type: string }
          - { name: heading, label: Heading, type: string }
          - { name: intro, label: Intro paragraph, type: text, required: false }
          - name: groups
            label: Checklist groups
            type: object
            list: true
            fields:
              - { name: name, label: "Group name (e.g. \"If you're speaking\")", type: string }
              - name: items
                label: Checklist items
                type: string
                list: true
      - name: first_90
        label: First 90 days (Members page only)
        type: object
        fields:
          - { name: eyebrow, label: Eyebrow, type: string }
          - { name: heading, label: Heading, type: string }
          - { name: intro, label: Footer note (optional), type: text, required: false }
          - name: milestones
            label: Milestones (ordered)
            type: object
            list: true
            fields:
              - { name: when, label: "When (e.g. \"Week 1\")", type: string }
              - { name: text, label: What to do, type: text }

