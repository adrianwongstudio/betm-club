# PagesCMS configuration — https://pagescms.org
# Sign in at https://app.pagescms.org with GitHub, add this repo, and edit content
# from a friendly UI. Every entry below becomes one item in the CMS sidebar.
# Saving in PagesCMS commits to `main` and the host rebuilds automatically.

media:
  input: src/images
  output: /images

content:
  # ─────────────────────────────────────────────────────────────────────────
  #   Site settings
  # ─────────────────────────────────────────────────────────────────────────
  - name: site
    label: "⚙︎ Site settings"
    type: file
    path: src/_data/site.json
    format: json
    fields:
      - { name: name, label: Full club name, type: string }
      - { name: short_name, label: Short name, type: string }
      - { name: url, label: Live site URL, type: string, pattern: "^https?://" }
      - { name: description, label: SEO description, type: text }
      - { name: tagline, label: Footer tagline, type: string }
      - { name: logo, label: Logo image, type: image }
      - { name: email, label: Contact email, type: string }
      - { name: district, label: District, type: string }
      - { name: chartered, label: Chartered date, type: string }
      - { name: years_running, label: Years running, type: number }
      - { name: meeting_time, label: Meeting time, type: string }
      - { name: meeting_venue, label: Meeting venue, type: string }
      - { name: meeting_venue_sub, label: Venue sub-line, type: string }
      - name: map_embed_url
        label: Google Maps embed URL (optional)
        type: string
        required: false
        description: |
          Must be the "Embed a map" URL (starts with https://www.google.com/maps/embed).
          Get it from Google Maps → Share → Embed a map → copy the src= value.
          Regular share URLs (maps.app.goo.gl/...) do NOT work — Google blocks them from iframes.
          If left blank or set to a non-embed URL, the site falls back to a link-out map placeholder.

  # ─────────────────────────────────────────────────────────────────────────
  #   Homepage — hero band only. All other homepage sections are previews of
  #   the page content edited below, so editing About/Members/Gala/Gallery/Attend
  #   also updates the homepage.
  # ─────────────────────────────────────────────────────────────────────────
  - name: hero
    label: "🏠 Home — hero band"
    type: file
    path: src/_data/hero.json
    format: json
    fields:
      - { name: eyebrow, label: Eyebrow, type: string }
      - { name: headline_html, label: Headline (use <br /> for line breaks), type: text }
      - { name: lead, label: Lead paragraph, type: text }
      - name: primary_cta
        label: Primary button
        type: object
        fields:
          - { name: label, label: Label, type: string }
          - { name: href, label: Link, type: string }
      - name: secondary_cta
        label: Secondary button
        type: object
        fields:
          - { name: label, label: Label, type: string }
          - { name: href, label: Link, type: string }
      - name: slides
        label: Hero slideshow
        type: object
        list: true
        fields:
          - { name: caption, label: Caption, type: string }
          - { name: image, label: Photo (portrait 4:5 works best), type: image, required: false }
      - { name: stat_number, label: 'Stat headline (e.g. "10 yrs")', type: string }
      - { name: stat_label, label: Stat sub-line, type: string }

  # ─────────────────────────────────────────────────────────────────────────
  #   Guests page — the marketing landing page for prospective visitors
  # ─────────────────────────────────────────────────────────────────────────
  - name: guest
    label: "👋 Guests page"
    type: file
    path: src/_data/guest.json
    format: json
    fields:
      - name: meta
        label: SEO
        type: object
        fields:
          - { name: title, label: Page title, type: string }
          - { name: description, label: Meta description, type: text }
      - name: page_hero
        label: Page top band
        type: object
        fields:
          - { name: eyebrow, label: Eyebrow, type: string }
          - { name: headline, label: Headline, type: string }
          - { name: intro, label: Intro paragraph, type: text, required: false }
      - name: club_experience
        label: Club experience (icon grid)
        type: object
        fields:
          - { name: eyebrow, label: Eyebrow, type: string }
          - { name: heading, label: Heading, type: string }
          - name: items
            label: Tiles (6 recommended)
            type: object
            list: true
            fields:
              - name: icon
                label: Icon
                type: select
                options:
                  values: [mic, star, thumbs-up, laptop, users, gavel, clock, check, arrow-right]
              - { name: text, label: Text, type: string }
      - name: why
        label: "Why entrepreneurs specifically"
        type: object
        fields:
          - { name: eyebrow, label: Eyebrow, type: string }
          - { name: headline, label: Headline, type: string }
          - name: paragraphs
            label: Body paragraphs
            type: string
            list: true
      - name: situations
        label: Situations mapping table
        type: object
        fields:
          - { name: eyebrow, label: Eyebrow, type: string }
          - { name: heading, label: Heading, type: string }
          - name: rows
            label: Rows
            type: object
            list: true
            fields:
              - { name: situation, label: The situation, type: string }
              - { name: drill, label: What the club drills, type: text }
      - name: quotes
        label: Pull quotes
        type: object
        list: true
        fields:
          - { name: body, label: Quote, type: text }
          - { name: attribution, label: Attribution, type: string }
      - name: agenda
        label: "Meeting agenda timeline"
        type: object
        fields:
          - { name: eyebrow, label: Eyebrow, type: string }
          - { name: heading, label: Heading, type: string }
          - name: items
            label: Timeline items
            type: object
            list: true
            fields:
              - { name: time, label: Time, type: string }
              - { name: text, label: Description, type: text }
          - { name: promise_label, label: Promise label, type: string, required: false }
          - { name: promise, label: "The one-line promise", type: text, required: false }
      - name: pathways
        label: "Pathways programme"
        type: object
        fields:
          - { name: eyebrow, label: Eyebrow, type: string }
          - { name: headline, label: Headline, type: string }
          - { name: intro, label: Intro, type: text }
          - { name: how_heading, label: How-it-works heading, type: string }
          - name: how_items
            label: How-it-works items
            type: string
            list: true
          - { name: competencies_heading, label: Competencies heading, type: string }
          - name: competencies
            label: Competency pills
            type: string
            list: true
          - name: more_link
            label: More-link (external)
            type: object
            fields:
              - { name: label, label: Label, type: string }
              - { name: href, label: URL, type: string }
      - name: cost
        label: "What it costs"
        type: object
        fields:
          - { name: eyebrow, label: Eyebrow, type: string }
          - { name: headline, label: Headline, type: string }
          - { name: intro, label: Intro, type: text, required: false }
          - name: items
            label: Price rows
            type: object
            list: true
            fields:
              - { name: item, label: Item, type: string }
              - { name: amount, label: Amount, type: string }
          - { name: footer, label: Footer note, type: text, required: false }
      - name: closing
        label: "Closing call to action"
        type: object
        fields:
          - { name: eyebrow, label: Eyebrow, type: string }
          - { name: headline, label: Headline, type: string }
          - { name: body, label: Body, type: text }
          - name: primary_cta
            label: Primary button
            type: object
            fields:
              - { name: label, label: Label, type: string }
              - { name: href, label: Link, type: string }
          - name: secondary_cta
            label: Secondary button
            type: object
            fields:
              - { name: label, label: Label, type: string }
              - { name: href, label: Link, type: string }
          - { name: tertiary_prefix, label: Tertiary prefix (e.g. "Not in Burnaby?"), type: string, required: false }
          - name: tertiary_link
            label: Tertiary text link
            type: object
            fields:
              - { name: label, label: Label, type: string }
              - { name: href, label: URL, type: string }

  # ─────────────────────────────────────────────────────────────────────────
  #   About page
  # ─────────────────────────────────────────────────────────────────────────
  - name: about
    label: "📖 About page"
    type: file
    path: src/_data/about.json
    format: json
    fields:
